<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="Atharv AI - Your AI. Every Language. Every Question."
  >

  <title>Atharv AI</title>

  <link
    rel="manifest"
    href="/manifest.json?v=17.0.2"
  >

  <link
    rel="stylesheet"
    href="/css/style.css?v=17.0.2"
  >
</head>

<body>

  <div id="app">

    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="topbar">

      <div class="brand">
        <div class="brand-logo">A</div>

        <div>
          <div class="brand-name">
            ATHARV
          </div>

          <div class="brand-subtitle">
            AI
          </div>
        </div>
      </div>

      <div class="top-actions">

        <button
          id="memoryButton"
          class="icon-button"
          type="button"
          title="Memory"
        >
          🧠
        </button>

        <button
          id="newChatButton"
          class="icon-button"
          type="button"
          title="New chat"
        >
          ＋
        </button>

      </div>

    </header>


    <!-- =================================================
         CHAT
    ================================================== -->

    <main
      id="chatContainer"
      class="chat-container"
    >

      <section
        id="welcomeScreen"
        class="welcome-screen"
      >

        <div class="welcome-logo">
          A
        </div>

        <h1>
          ATHARV
        </h1>

        <p>
          Your AI. Every Language. Every Question.
        </p>

        <div class="suggestions">

          <button
            type="button"
            class="suggestion"
            data-message="Explain this topic in simple language."
          >
            Explain something
          </button>

          <button
            type="button"
            class="suggestion"
            data-message="Help me learn Python from beginner level."
          >
            Learn Python
          </button>

          <button
            type="button"
            class="suggestion"
            data-message="What are the latest important news today?"
            data-live="true"
          >
            Latest information
          </button>

          <button
            type="button"
            class="suggestion"
            data-message="Help me prepare for an exam."
          >
            Exam preparation
          </button>

        </div>

      </section>


      <div
        id="messages"
        class="messages"
        aria-live="polite"
      ></div>

    </main>


    <!-- =================================================
         COMPOSER
    ================================================== -->

    <section class="composer-area">

      <div
        id="filePreview"
        class="file-preview hidden"
      ></div>

      <form
        id="chatForm"
        class="composer"
        autocomplete="off"
      >

        <input
          id="fileInput"
          type="file"
          hidden
          accept="image/*,.pdf,.txt,.doc,.docx"
        >

        <button
          id="attachButton"
          class="composer-button"
          type="button"
          title="Attach"
        >
          ＋
        </button>

        <textarea
          id="messageInput"
          rows="1"
          maxlength="12000"
          placeholder="Message Atharv..."
          autocomplete="off"
          spellcheck="true"
        ></textarea>

        <button
          id="liveButton"
          class="live-button"
          type="button"
          title="Live search"
          aria-pressed="false"
        >
          Live
        </button>

        <button
          id="sendButton"
          class="send-button"
          type="submit"
          title="Send"
          aria-label="Send message"
        >
          ↑
        </button>

      </form>

      <div class="composer-info">
        <span id="modeLabel">
          Normal mode
        </span>

        <span>
          Atharv can make mistakes. Check important information.
        </span>
      </div>

    </section>


    <!-- =================================================
         MEMORY MODAL
    ================================================== -->

    <div
      id="memoryModal"
      class="modal hidden"
      aria-hidden="true"
    >

      <div class="modal-card">

        <div class="modal-header">

          <div>
            <h2>Memory</h2>
            <p>Atharv's saved memories</p>
          </div>

          <button
            id="closeMemoryButton"
            class="close-button"
            type="button"
          >
            ×
          </button>

        </div>

        <div
          id="memoryList"
          class="memory-list"
        >
          Loading...
        </div>

        <div class="modal-footer">

          <button
            id="closeMemoryButton2"
            class="secondary-button"
            type="button"
          >
            Close
          </button>

        </div>

      </div>

    </div>


    <!-- =================================================
         TOAST
    ================================================== -->

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
    ></div>

  </div>


  <!-- ===================================================
       MAIN APPLICATION
  ==================================================== -->

  <script
    type="module"
    src="/js/app.js?v=17.0.2"
  ></script>

</body>
</html>
