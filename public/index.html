<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Atharv AI - Your AI. Every Language. Every Question.">

  <link rel="manifest" href="/manifest.json?v=20.0.0">
  <link rel="stylesheet" href="/style.css?v=20.0.0">

  <title>Atharv AI</title>
</head>

<body>

<div id="app">

  <!-- TOP BAR -->
  <header class="topbar">

    <button
      id="menuButton"
      class="icon-btn"
      type="button"
      aria-label="Open menu"
    >☰</button>

    <div class="brand">
      <div class="brand-mark">A</div>

      <div class="brand-text">
        <div class="brand-name">Atharv AI</div>
        <div class="brand-subtitle">
          Your AI. Every Language. Every Question.
        </div>
      </div>
    </div>

    <button
      id="newChatButton"
      class="icon-btn"
      type="button"
      aria-label="New chat"
    >＋</button>

  </header>


  <!-- CHAT -->
  <main id="chatArea" class="chat-area">

    <section id="welcome" class="welcome">

      <div class="welcome-logo">A</div>

      <h1>How can I help you?</h1>

      <p>
        Ask anything in English, Hindi, Hinglish,
        or your preferred language.
      </p>

      <div class="quick-grid">

        <button
          class="quick-card"
          type="button"
          data-prompt="Explain this in simple language"
        >
          💡 Explain something
        </button>

        <button
          class="quick-card"
          type="button"
          data-prompt="Help me write a professional message"
        >
          ✍️ Help me write
        </button>

        <button
          class="quick-card"
          type="button"
          data-prompt="Teach me this step by step"
        >
          📚 Teach me
        </button>

        <button
          class="quick-card"
          type="button"
          data-prompt="Search the latest information about "
        >
          🔎 Latest information
        </button>

      </div>

    </section>


    <div
      id="messages"
      class="messages"
      aria-live="polite"
    ></div>

  </main>


  <!-- THINKING -->
  <div
    id="typingIndicator"
    class="typing-indicator hidden"
    aria-hidden="true"
  >
    <span></span>
    <span></span>
    <span></span>
    <span class="thinking-text">Atharv is thinking…</span>
  </div>


  <!-- COMPOSER -->
  <section class="composer-wrap">

    <div
      id="attachmentPreview"
      class="attachment-preview hidden"
    ></div>

    <form
      id="composer"
      class="composer"
      autocomplete="off"
    >

      <button
        id="plusButton"
        class="composer-btn"
        type="button"
        aria-label="More options"
      >＋</button>


      <label
        class="composer-btn file-btn"
        for="fileInput"
        aria-label="Attach file"
      >📎</label>

      <input
        id="fileInput"
        type="file"
        hidden
        multiple
      >


      <textarea
        id="messageInput"
        rows="1"
        maxlength="12000"
        placeholder="Message Atharv…"
        aria-label="Message Atharv"
      ></textarea>


      <button
        id="voiceButton"
        class="composer-btn"
        type="button"
        aria-label="Voice input"
      >🎙️</button>


      <button
        id="sendButton"
        class="send-btn"
        type="submit"
        aria-label="Send message"
      >➤</button>

    </form>

    <div class="composer-note">
      Atharv AI can make mistakes. Check important information.
    </div>

  </section>

</div>


<!-- MENU OVERLAY -->
<div
  id="menuOverlay"
  class="overlay hidden"
></div>


<!-- SIDE MENU -->
<aside
  id="atharvMenu"
  class="side-menu"
  aria-hidden="true"
>

  <div class="menu-head">

    <div>
      <strong>Atharv AI</strong>
      <small>Settings & options</small>
    </div>

    <button
      id="menuClose"
      class="icon-btn"
      type="button"
      aria-label="Close menu"
    >×</button>

  </div>


  <button
    class="menu-item"
    id="menuNewChat"
    type="button"
  >
    🆕 New chat
  </button>


  <button
    class="menu-item"
    id="liveSearchToggle"
    type="button"
  >
    🌐 Live Search
    <span id="liveState">OFF</span>
  </button>


  <button
    class="menu-item"
    id="memoryButton"
    type="button"
  >
    🧠 Memory
  </button>


  <button
    class="menu-item"
    id="historyButton"
    type="button"
  >
    🕘 Chat history
  </button>


  <button
    class="menu-item"
    id="installButton"
    type="button"
  >
    📱 Install app
  </button>


  <button
    class="menu-item"
    id="clearButton"
    type="button"
  >
    🗑️ Clear current chat
  </button>


  <div class="menu-footer">
    Atharv AI v20.0.0
  </div>

</aside>


<!-- TOAST -->
<div
  id="toast"
  class="toast hidden"
  role="status"
></div>


<script src="/chat.js?v=20.0.0"></script>
<script src="/app.js?v=20.0.0"></script>

</body>
</html>
