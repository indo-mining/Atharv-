<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="Atharv AI - Your AI. Every Language. Every Question."
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>Atharv AI</title>

    <link
        rel="manifest"
        href="/manifest.json?v=22.0.0"
    >

    <link
        rel="stylesheet"
        href="/style.css?v=22.0.0"
    >

</head>

<body>

<div id="app">

    <!-- TOP BAR -->

    <header class="topbar">

        <button
            id="menuButton"
            class="icon-button"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

        <div class="brand">

            <div class="brand-mark">
                A
            </div>

            <div class="brand-text">
                <strong>Atharv AI</strong>
                <span>Your AI. Every Language. Every Question.</span>
            </div>

        </div>

        <button
            id="newChatButton"
            class="new-chat-button"
            type="button"
        >
            ＋
            <span>New chat</span>
        </button>

    </header>


    <!-- CHAT -->

    <main
        id="chatArea"
        class="chat-area"
    >

        <section
            id="welcome"
            class="welcome"
        >

            <div class="welcome-logo">
                A
            </div>

            <h1>
                How can I help you?
            </h1>

            <p>
                Ask anything. Write in English, Hindi,
                Hinglish or your preferred language.
            </p>

            <div class="quick-grid">

                <button
                    class="quick-card"
                    type="button"
                    data-prompt="Explain this topic in simple language."
                >
                    <span>💡</span>
                    <strong>Explain something</strong>
                    <small>Learn any topic simply</small>
                </button>

                <button
                    class="quick-card"
                    type="button"
                    data-prompt="Help me write a professional message."
                >
                    <span>✍️</span>
                    <strong>Write for me</strong>
                    <small>Messages, emails and documents</small>
                </button>

                <button
                    class="quick-card"
                    type="button"
                    data-prompt="Help me solve this problem step by step."
                >
                    <span>🧩</span>
                    <strong>Solve a problem</strong>
                    <small>Step-by-step guidance</small>
                </button>

                <button
                    class="quick-card"
                    type="button"
                    data-prompt="Help me write and understand code."
                >
                    <span>💻</span>
                    <strong>Code with me</strong>
                    <small>Programming and debugging</small>
                </button>

            </div>

        </section>


        <section
            id="messages"
            class="messages"
            aria-live="polite"
        ></section>


        <div
            id="typingIndicator"
            class="typing-indicator hidden"
        >

            <div class="typing-avatar">
                A
            </div>

            <div class="typing-box">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </main>


    <!-- COMPOSER -->

    <form
        id="composer"
        class="composer"
        autocomplete="off"
    >

        <div
            id="attachmentPreview"
            class="attachment-preview"
        ></div>

        <div class="composer-inner">

            <button
                id="plusButton"
                class="composer-button"
                type="button"
                aria-label="More options"
            >
                ＋
            </button>

            <label
                class="composer-button"
                for="fileInput"
                aria-label="Attach file"
            >
                📎
            </label>

            <input
                id="fileInput"
                type="file"
                hidden
                multiple
            >

            <textarea
                id="messageInput"
                rows="1"
                maxlength="12000"
                placeholder="Message Atharv…"
                aria-label="Message Atharv"
            ></textarea>

            <button
                id="voiceButton"
                class="composer-button"
                type="button"
                aria-label="Voice input"
            >
                🎙️
            </button>

            <button
                id="sendButton"
                class="send-button"
                type="submit"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

    </form>


    <!-- MENU OVERLAY -->

    <div
        id="menuOverlay"
        class="menu-overlay"
    ></div>


    <!-- SIDE MENU -->

    <aside
        id="atharvMenu"
        class="side-menu"
        aria-hidden="true"
    >

        <div class="menu-header">

            <div>
                <strong>Atharv AI</strong>
                <span>Options</span>
            </div>

            <button
                id="menuClose"
                class="icon-button"
                type="button"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>


        <div class="menu-content">

            <button
                id="menuNewChat"
                class="menu-item"
                type="button"
            >
                <span>📝</span>
                <div>
                    <strong>New chat</strong>
                    <small>Start a fresh conversation</small>
                </div>
            </button>


            <button
                id="liveSearchToggle"
                class="menu-item"
                type="button"
            >
                <span>🌐</span>
                <div>
                    <strong>Live Search</strong>
                    <small id="liveState">Off</small>
                </div>

                <span
                    id="liveSwitch"
                    class="switch"
                >
                    <span></span>
                </span>

            </button>


            <button
                id="memoryButton"
                class="menu-item"
                type="button"
            >
                <span>🧠</span>
                <div>
                    <strong>Memory</strong>
                    <small>View saved memories</small>
                </div>
            </button>


            <button
                id="historyButton"
                class="menu-item"
                type="button"
            >
                <span>🕘</span>
                <div>
                    <strong>Chat history</strong>
                    <small>View this device's chats</small>
                </div>
            </button>


            <button
                id="installButton"
                class="menu-item hidden"
                type="button"
            >
                <span>📲</span>
                <div>
                    <strong>Install Atharv AI</strong>
                    <small>Add to home screen</small>
                </div>
            </button>


            <button
                id="clearButton"
                class="menu-item danger"
                type="button"
            >
                <span>🗑️</span>
                <div>
                    <strong>Clear chat</strong>
                    <small>Remove current conversation</small>
                </div>
            </button>

        </div>


        <div class="menu-footer">
            <span>Atharv AI</span>
            <span>v22.0.0</span>
        </div>

    </aside>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
        role="status"
    ></div>

</div>


<script src="/chat.js?v=22.0.3"></script>
<script src="/app.js?v=22.0.3"></script>

</body>
</html>
