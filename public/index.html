<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Atharv AI — Your AI for every language and every question.">

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192.png">

    <title>Atharv AI</title>

    <link rel="stylesheet" href="/css/style.css?v=18.0.0">
</head>

<body>

<div id="app">

    <!-- ================= HEADER ================= -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">
                <span>A</span>
            </div>

            <div class="brand-text">
                <div class="brand-name">ATHARV</div>
                <div class="brand-subtitle">AI Assistant</div>
            </div>

        </div>

        <div class="header-actions">

            <button
                id="newChatButton"
                class="header-button"
                type="button"
                title="New chat"
                aria-label="New chat"
            >
                <span>＋</span>
            </button>

            <button
                id="memoryButton"
                class="header-button"
                type="button"
                title="Memory"
                aria-label="Memory"
            >
                <span>✦</span>
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <section id="chatContainer" class="chat-container">

            <!-- ================= WELCOME ================= -->

            <div id="welcome" class="welcome">

                <div class="welcome-logo">
                    <span>A</span>
                </div>

                <h1>How can I help you?</h1>

                <p class="welcome-description">
                    Ask Atharv anything. Learn, create, search,
                    code, solve problems and explore ideas.
                </p>


                <div class="suggestions">

                    <button
                        class="suggestion"
                        type="button"
                        data-prompt="Explain this topic in simple words"
                    >
                        <span class="suggestion-icon">💡</span>

                        <span class="suggestion-content">
                            <strong>Explain something</strong>
                            <small>Make a difficult topic simple</small>
                        </span>

                        <span class="suggestion-arrow">›</span>
                    </button>


                    <button
                        class="suggestion"
                        type="button"
                        data-prompt="Help me write something professionally"
                    >
                        <span class="suggestion-icon">✍️</span>

                        <span class="suggestion-content">
                            <strong>Write with me</strong>
                            <small>Emails, posts, documents and more</small>
                        </span>

                        <span class="suggestion-arrow">›</span>
                    </button>


                    <button
                        class="suggestion"
                        type="button"
                        data-prompt="Help me solve this problem step by step"
                    >
                        <span class="suggestion-icon">🧠</span>

                        <span class="suggestion-content">
                            <strong>Solve a problem</strong>
                            <small>Get a clear step-by-step answer</small>
                        </span>

                        <span class="suggestion-arrow">›</span>
                    </button>


                    <button
                        class="suggestion"
                        type="button"
                        data-prompt="Write a Python program for me"
                    >
                        <span class="suggestion-icon">💻</span>

                        <span class="suggestion-content">
                            <strong>Code with Atharv</strong>
                            <small>Python, JavaScript and programming</small>
                        </span>

                        <span class="suggestion-arrow">›</span>
                    </button>

                </div>


                <div class="example-section">

                    <div class="example-title">
                        Try asking
                    </div>

                    <div class="example-chips">

                        <button
                            class="example-chip"
                            type="button"
                            data-prompt="What is artificial intelligence?"
                        >
                            What is AI?
                        </button>

                        <button
                            class="example-chip"
                            type="button"
                            data-prompt="Teach me English speaking from basic level"
                        >
                            Teach me English
                        </button>

                        <button
                            class="example-chip"
                            type="button"
                            data-prompt="Explain today's important news"
                        >
                            Today's news
                        </button>

                    </div>

                </div>

            </div>


            <!-- ================= MESSAGES ================= -->

            <div id="messages" class="messages"></div>


            <!-- ================= THINKING ================= -->

            <div id="thinking" class="thinking hidden">

                <div class="thinking-avatar">
                    A
                </div>

                <div class="thinking-card">

                    <span class="thinking-label">
                        Atharv
                    </span>

                    <div class="thinking-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

            </div>

        </section>


        <!-- ================= COMPOSER ================= -->

        <section class="composer-area">

            <form id="chatForm" class="composer">

                <div
                    id="attachmentInfo"
                    class="attachment-info hidden"
                ></div>


                <div class="composer-row">

                    <button
                        id="attachmentButton"
                        class="composer-button"
                        type="button"
                        title="Attach file"
                        aria-label="Attach file"
                    >
                        <span>＋</span>
                    </button>

                    <input
                        id="fileInput"
                        type="file"
                        hidden
                        multiple
                        accept=".txt,.pdf,.doc,.docx,.jpg,.jpeg,.png,.webp,.csv,.json"
                    >


                    <div class="input-wrapper">

                        <textarea
                            id="messageInput"
                            rows="1"
                            maxlength="12000"
                            autocomplete="off"
                            spellcheck="true"
                            placeholder="Message Atharv..."
                            aria-label="Message Atharv"
                        ></textarea>

                    </div>


                    <button
                        id="liveButton"
                        class="composer-button live-button"
                        type="button"
                        title="Live search"
                        aria-label="Live search"
                        aria-pressed="false"
                    >
                        <span class="live-dot"></span>
                    </button>


                    <button
                        id="voiceButton"
                        class="composer-button voice-button"
                        type="button"
                        title="Voice input"
                        aria-label="Voice input"
                        aria-pressed="false"
                    >
                        🎤
                    </button>


                    <button
                        id="sendButton"
                        class="send-button"
                        type="submit"
                        title="Send"
                        aria-label="Send"
                    >
                        <span>↑</span>
                    </button>

                </div>

            </form>


            <div class="footer-note">
                Atharv can make mistakes. Check important information.
            </div>

        </section>

    </main>


    <!-- ================= TOAST ================= -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- ================= MEMORY MODAL ================= -->

    <div
        id="memoryModal"
        class="modal hidden"
        aria-hidden="true"
    >

        <div class="modal-backdrop"></div>

        <div class="modal-box">

            <div class="modal-header">

                <div>
                    <div class="modal-title">
                        Atharv Memory
                    </div>

                    <div class="modal-subtitle">
                        Information Atharv remembers
                    </div>
                </div>

                <button
                    id="closeMemoryButton"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>

            <div id="memoryList" class="memory-list">
                <div class="memory-empty">
                    No saved memories yet.
                </div>
            </div>

        </div>

    </div>

</div>


<script src="/js/app.js?v=18.0.0"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register(
            "/service-worker.js?v=18.0.0"
        ).catch(() => {});
    });
}
</script>

</body>
</html>
