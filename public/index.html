<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="Atharv AI - Your AI. Every Language. Every Question."
    >

    <title>Atharv AI</title>

    <link
        rel="manifest"
        href="./manifest.json?v=19.2.0"
    >

    <link
        rel="stylesheet"
        href="./style.css?v=19.2.0"
    >

</head>


<body>

    <div
        id="app"
        class="app"
    >

        <!-- HEADER -->

        <header class="topbar">

            <button
                id="menuButton"
                type="button"
                aria-label="Open menu"
                aria-expanded="false"
            >
                ☰
            </button>


            <div class="brand">

                <div class="brand-logo">
                    A
                </div>

                <div class="brand-text">

                    <strong>
                        Atharv AI
                    </strong>

                    <span>
                        Your AI. Every Language. Every Question.
                    </span>

                </div>

            </div>

        </header>


        <!-- CHAT -->

        <main
            id="chatMessages"
            class="chat-messages"
        >

            <section
                id="welcomeScreen"
                class="welcome"
            >

                <div class="welcome-inner">

                    <div class="welcome-logo">
                        A
                    </div>

                    <h1>
                        How can I help you?
                    </h1>

                    <p>
                        Your AI. Every Language. Every Question.
                    </p>

                </div>

            </section>

        </main>


        <!-- MENU OVERLAY -->

        <div
            id="menuOverlay"
            class="menu-overlay"
            aria-hidden="true"
        ></div>


        <!-- SIDE MENU -->

        <aside
            id="atharvMenu"
            class="atharv-menu"
            aria-label="Atharv AI menu"
        >

            <div class="menu-header">

                <strong>
                    Atharv AI
                </strong>

                <button
                    id="menuClose"
                    type="button"
                    aria-label="Close menu"
                >
                    ×
                </button>

            </div>


            <div class="menu-content">

                <button
                    id="newChatButton"
                    type="button"
                    class="menu-item"
                >
                    <span>＋</span>
                    <span>New Chat</span>
                </button>


                <button
                    id="liveSearchButton"
                    type="button"
                    class="menu-item"
                    aria-pressed="false"
                >
                    <span>🌐</span>
                    <span>Live Search</span>
                </button>


                <button
                    id="memoryButton"
                    type="button"
                    class="menu-item"
                >
                    <span>🧠</span>
                    <span>Memory</span>
                </button>


                <button
                    id="historyButton"
                    type="button"
                    class="menu-item"
                >
                    <span>🕘</span>
                    <span>History</span>
                </button>


                <button
                    id="clearChatButton"
                    type="button"
                    class="menu-item danger"
                >
                    <span>🗑️</span>
                    <span>Clear Chat</span>
                </button>

            </div>

        </aside>


        <!-- COMPOSER
             DO NOT CHANGE -->

        <form
            id="composer"
            class="composer"
            autocomplete="off"
        >

            <button
                id="addButton"
                type="button"
                aria-label="Add"
            >
                ＋
            </button>


            <button
                id="attachmentButton"
                type="button"
                aria-label="Attach file"
            >
                📎
            </button>


            <textarea
                id="messageInput"
                rows="1"
                maxlength="12000"
                placeholder="Message Atharv…"
                autocomplete="off"
                spellcheck="true"
            ></textarea>


            <button
                id="voiceButton"
                type="button"
                aria-label="Voice input"
            >
                🎙️
            </button>


            <button
                id="sendButton"
                type="submit"
                aria-label="Send message"
            >
                ➤
            </button>


            <input
                id="fileInput"
                type="file"
                hidden
                multiple
            >

        </form>

    </div>


    <!-- ONLY ONE APP SCRIPT -->

    <script
        src="./app.js?v=19.2.0"
        defer
    ></script>


    <!-- SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register("./sw.js?v=19.2.0")
                        .then(function (registration) {

                            console.log(
                                "ATHARV AI: Service Worker registered",
                                registration.scope
                            );

                        })
                        .catch(function (error) {

                            console.warn(
                                "ATHARV AI Service Worker:",
                                error
                            );

                        });

                }
            );

        }

    </script>

</body>

</html>
