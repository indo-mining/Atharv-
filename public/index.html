<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ffffff">

    <meta
        name="description"
        content="Atharv AI - Your AI. Every Language. Every Question."
    >

    <title>Atharv AI</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="app">

    <!-- HEADER -->
    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">A</div>

            <div class="brand-text">

                <div class="brand-title">
                    Atharv AI
                </div>

                <div class="brand-subtitle">
                    Your AI. Every Language. Every Question.
                </div>

            </div>

        </div>

        <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="Open menu"
            aria-controls="atharvMenu"
            aria-expanded="false"
        >
            ☰
        </button>

    </header>


    <!-- CHAT -->
    <main
        id="chatMessages"
        aria-live="polite"
    >

        <section
            id="welcomeScreen"
            class="welcome"
        >

            <div class="welcome-inner">

                <div class="welcome-logo">
                    A
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Your AI. Every Language. Every Question.
                </p>

            </div>

        </section>

    </main>


    <!-- MENU OVERLAY -->
    <div
        id="menuOverlay"
        aria-hidden="true"
    ></div>


    <!-- SIDE MENU -->
    <aside
        id="atharvMenu"
        aria-label="Atharv AI menu"
    >

        <div class="menu-header">

            <div class="menu-title">
                Atharv AI
            </div>

            <button
                id="menuClose"
                class="menu-close"
                type="button"
                aria-label="Close menu"
            >
                ✕
            </button>

        </div>


        <div class="menu-content">

            <button
                id="newChatButton"
                class="menu-item"
                type="button"
            >
                <span class="menu-item-icon">＋</span>

                <span class="menu-item-text">
                    <strong>New Chat</strong>
                    <small>Start a new conversation</small>
                </span>
            </button>


            <button
                id="liveSearchButton"
                class="menu-item"
                type="button"
            >
                <span class="menu-item-icon">🔎</span>

                <span class="menu-item-text">
                    <strong>Live Search</strong>
                    <small>Search current information</small>
                </span>
            </button>


            <button
                id="memoryButton"
                class="menu-item"
                type="button"
            >
                <span class="menu-item-icon">🧠</span>

                <span class="menu-item-text">
                    <strong>Memory</strong>
                    <small>Manage Atharv memory</small>
                </span>
            </button>


            <button
                id="historyButton"
                class="menu-item"
                type="button"
            >
                <span class="menu-item-icon">🕘</span>

                <span class="menu-item-text">
                    <strong>Chat History</strong>
                    <small>Saved conversations</small>
                </span>
            </button>


            <button
                id="clearChatButton"
                class="menu-item danger"
                type="button"
            >
                <span class="menu-item-icon">🗑️</span>

                <span class="menu-item-text">
                    <strong>Clear Chat</strong>
                    <small>Clear current conversation</small>
                </span>
            </button>

        </div>

    </aside>


    <!-- COMPOSER -->
    <div class="composer-area">

        <div
            id="composer"
            class="composer"
        >

            <button
                id="addButton"
                class="composer-icon"
                type="button"
                aria-label="More options"
            >
                ＋
            </button>


            <button
                id="attachmentButton"
                class="composer-icon"
                type="button"
                aria-label="Attach file"
            >
                📎
            </button>


            <textarea
                id="messageInput"
                name="message"
                rows="1"
                maxlength="12000"
                autocomplete="off"
                autocorrect="on"
                spellcheck="true"
                placeholder="Message Atharv…"
                aria-label="Message Atharv"
            ></textarea>


            <button
                id="voiceButton"
                class="composer-icon"
                type="button"
                aria-label="Voice input"
            >
                🎙️
            </button>


            <button
                id="sendButton"
                class="send-button"
                type="button"
                aria-label="Send message"
                title="Send"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- FILE INPUT -->
<input
    id="fileInput"
    type="file"
    hidden
    multiple
>


<!-- APP LOGIC -->
<script src="./app.js"></script>

<!-- CHAT/API LOGIC -->
<script src="./script.js"></script>


<!-- SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
            .catch(function (error) {
                console.log("Service worker:", error);
            });
    });
}
</script>

</body>
</html>
