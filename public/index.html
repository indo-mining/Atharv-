<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>Atharv AI</title>

  <link rel="manifest" href="/manifest.json?v=17.0.3">
  <link rel="stylesheet" href="/css/style.css?v=17.0.3">
</head>

<body>

  <div id="app">

    <header class="topbar">

      <div class="brand">
        <div class="brand-name">ATHARV</div>
        <div class="brand-subtitle">Your AI. Every Language. Every Question.</div>
      </div>

      <div class="header-actions">
        <button id="newChatButton" type="button">＋</button>
        <button id="memoryButton" type="button">🧠</button>
      </div>

    </header>


    <main class="main">

      <section id="chatContainer" class="chat-container">

        <div id="welcome" class="welcome">

          <h1>Namaste 👋</h1>

          <p>
            Main Atharv hoon. Aap mujhse kuch bhi pooch sakte hain.
          </p>

          <div class="suggestions">

            <button type="button" class="suggestion">
              India ke baare mein batao
            </button>

            <button type="button" class="suggestion">
              Python kya hai?
            </button>

            <button type="button" class="suggestion">
              Aaj ka weather batao
            </button>

          </div>

        </div>

        <div id="messages"></div>

      </section>


      <div id="thinking" class="thinking hidden">
        <span>Atharv soch raha hai...</span>
      </div>


      <div class="composer-area">

        <form
          id="chatForm"
          class="chat-form"
          action="#"
          method="post"
          novalidate
        >

          <textarea
            id="messageInput"
            name="message"
            rows="1"
            maxlength="12000"
            placeholder="Atharv se kuch poochiye..."
            autocomplete="off"
            enterkeyhint="send"
          ></textarea>

          <div class="composer-buttons">

            <button
              id="attachmentButton"
              type="button"
              class="icon-button"
              aria-label="Attach file"
            >
              📎
            </button>

            <input
              id="fileInput"
              type="file"
              hidden
            >

            <button
              id="liveButton"
              type="button"
              class="live-button"
            >
              🌐 Live
            </button>

            <button
              id="sendButton"
              type="submit"
              class="send-button"
            >
              ➤
            </button>

          </div>

        </form>

        <div id="attachmentInfo" class="attachment-info"></div>

        <div class="footer-note">
          Atharv AI can make mistakes. Verify important information.
        </div>

      </div>

    </main>


    <div id="toast" class="toast"></div>


    <div id="memoryModal" class="modal hidden">

      <div class="modal-box">

        <div class="modal-header">
          <h2>Memory</h2>

          <button
            id="closeMemoryButton"
            type="button"
          >
            ×
          </button>
        </div>

        <div id="memoryList">
          Loading...
        </div>

      </div>

    </div>

  </div>


  <!-- IMPORTANT:
       Normal script, NOT module.
       This avoids the submit-handler problem. -->
  <script src="/js/app.js?v=17.0.3" defer></script>

</body>
</html>
