<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="ATHARV AI — Your AI. Every Language. Every Question."
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <title>ATHARV AI</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

<!-- =================================================
     HEADER
     ================================================= -->

<header class="atharv-header">

    <div class="header-left">

        <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
        >
            ☰
        </button>


        <div class="atharv-brand">

            <div class="atharv-brand-title">
                ATHARV
            </div>

            <div class="atharv-brand-subtitle">
                Your AI. Every Language. Every Question.
            </div>

        </div>

    </div>


    <div class="header-right">

        <button
            id="profileButton"
            class="header-action"
            type="button"
            aria-label="Profile"
        >
            👤
        </button>

    </div>

</header>


<!-- =================================================
     MENU OVERLAY
     ================================================= -->

<div
    id="menuOverlay"
    class="menu-overlay"
    aria-hidden="true"
></div>


<!-- =================================================
     SIDE MENU
     ================================================= -->

<aside
    id="atharvMenu"
    class="menu-drawer"
    aria-hidden="true"
>

    <div class="menu-header">

        <strong>
            ATHARV
        </strong>

        <button
            id="menuClose"
            class="menu-close"
            type="button"
            aria-label="Close menu"
        >
            ✕
        </button>

    </div>


    <div class="menu-content">


        <!-- ================= MAIN ================= -->

        <div class="menu-section">

            <div class="menu-section-title">
                Main
            </div>


            <button
                id="newChatButton"
                class="menu-item"
                type="button"
            >

                <span class="menu-item-icon">
                    ✚
                </span>

                <span class="menu-item-text">

                    <span class="menu-item-title">
                        New Chat
                    </span>

                    <span class="menu-item-description">
                        Start a fresh conversation
                    </span>

                </span>

            </button>


            <button
                id="historyButton"
                class="menu-item"
                type="button"
            >

                <span class="menu-item-icon">
                    🕘
                </span>

                <span class="menu-item-text">

                    <span class="menu-item-title">
                        Chat History
                    </span>

                    <span class="menu-item-description">
                        Previous conversations
                    </span>

                </span>

            </button>

        </div>


        <!-- ================= TOOLS ================= -->

        <div class="menu-section">

            <div class="menu-section-title">
                Tools
            </div>


            <button
                id="liveButton"
                class="menu-item"
                type="button"
                aria-pressed="false"
            >

                <span class="menu-item-icon">
                    🌐
                </span>

                <span class="menu-item-text">

                    <span class="menu-item-title">
                        Live Search
                    </span>

                    <span class="menu-item-description">
                        Search current information
                    </span>

                </span>

            </button>


            <button
                id="memoryButton"
                class="menu-item"
                type="button"
            >

                <span class="menu-item-icon">
                    🧠
                </span>

                <span class="menu-item-text">

                    <span class="menu-item-title">
                        Memory
                    </span>

                    <span class="menu-item-description">
                        View saved memories
                    </span>

                </span>

            </button>


            <button
                id="menuAttachmentButton"
                class="menu-item"
                type="button"
            >

                <span class="menu-item-icon">
                    📎
                </span>

                <span class="menu-item-text">

                    <span class="menu-item-title">
                        Attach File
                    </span>

                    <span class="menu-item-description">
                        Add an image or document
                    </span>

                </span>

            </button>


            <button
                id="menuVoiceButton"
                class="menu-item"
                type="button"
            >

                <span class="menu-item-icon">
                    🎙️
                </span>

                <span class="menu-item-text">

                    <span class="menu-item-title">
                        Voice Input
                    </span>

                    <span class="menu-item-description">
                        Talk to Atharv
                    </span>

                </span>

            </button>

        </div>


        <!-- ================= APP ================= -->

        <div class="menu-section">

            <div class="menu-section-title">
                App
            </div>


            <button
                id="installAppButton"
                class="menu-item"
                type="button"
            >

                <span class="menu-item-icon">
                    📱
                </span>

                <span class="menu-item-text">

                    <span class="menu-item-title">
                        Install Atharv
                    </span>

                    <span class="menu-item-description">
                        Add Atharv to your device
                    </span>

                </span>

            </button>


            <button
                id="settingsButton"
                class="menu-item"
                type="button"
            >

                <span class="menu-item-icon">
                    ⚙️
                </span>

                <span class="menu-item-text">

                    <span class="menu-item-title">
                        Settings
                    </span>

                    <span class="menu-item-description">
                        App preferences
                    </span>

                </span>

            </button>

        </div>

    </div>


    <div class="menu-footer">
        ATHARV AI
    </div>

</aside>


<!-- =================================================
     CHAT PAGE
     ================================================= -->

<main class="chat-page">


    <!-- =================================================
         CHAT CONTAINER
         ================================================= -->

    <section
        id="chatContainer"
        class="chat-container"
    >


        <!-- ================= WELCOME ================= -->

        <div
            id="welcome"
            class="welcome"
        >

            <div class="welcome-logo">
                ATHARV
            </div>

            <h1>
                Your AI. Every Language. Every Question.
            </h1>

            <p>
                Ask anything and start a conversation.
            </p>


            <div class="suggestions">

                <button
                    type="button"
                    data-prompt="Explain something interesting to me."
                >
                    💡 Explain something
                </button>


                <button
                    type="button"
                    data-prompt="Help me learn something new."
                >
                    📚 Help me learn
                </button>


                <button
                    type="button"
                    data-prompt="Write something for me."
                >
                    ✍️ Write for me
                </button>

            </div>

        </div>


        <!-- =================================================
             MESSAGES
             app.js v18.0.0 REQUIRED
             ================================================= -->

        <div
            id="messages"
            class="messages"
        ></div>


        <!-- =================================================
             THINKING
             ================================================= -->

        <div
            id="thinking"
            class="thinking hidden"
        >

            <div class="thinking-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

            <span>
                Atharv is thinking...
            </span>

        </div>

    </section>


    <!-- =================================================
         ATTACHMENT INFO
         ================================================= -->

    <div
        id="attachmentInfo"
        class="attachment-info hidden"
    ></div>


    <!-- =================================================
         BOTTOM COMPOSER

         EXACT STRUCTURE:

         ＋ | Message Atharv… | 🎙️ | ➤

         Is section ko intentionally change nahi kiya gaya.
         ================================================= -->

    <div class="composer-wrapper">

        <form
            id="chatForm"
            class="composer"
            autocomplete="off"
        >


            <!-- ATTACHMENT -->

            <button
                id="attachmentButton"
                class="composer-side-button"
                type="button"
                aria-label="Attach file"
            >
                ＋
            </button>


            <input
                id="fileInput"
                type="file"
                hidden
                multiple
                accept="image/*,.pdf,.txt,.doc,.docx,.csv,.json"
            >


            <!-- MESSAGE -->

            <textarea
                id="messageInput"
                class="message-input"
                rows="1"
                maxlength="12000"
                placeholder="Message Atharv…"
                aria-label="Message Atharv"
            ></textarea>


            <!-- VOICE -->

            <button
                id="voiceButton"
                class="voice-button"
                type="button"
                aria-label="Voice input"
            >
                🎙️
            </button>


            <!-- SEND -->

            <button
                id="sendButton"
                class="send-button"
                type="submit"
                aria-label="Send message"
            >
                ➤
            </button>

        </form>

    </div>

</main>


<!-- =================================================
     TOAST
     ================================================= -->

<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>


<!-- =================================================
     MEMORY MODAL
     ================================================= -->

<div
    id="memoryModal"
    class="modal hidden"
    aria-hidden="true"
>

    <div class="modal-backdrop"></div>


    <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="memoryTitle"
    >

        <div class="modal-header">

            <h2 id="memoryTitle">
                Memory
            </h2>

            <button
                id="closeMemoryButton"
                type="button"
                aria-label="Close memory"
            >
                ✕
            </button>

        </div>


        <div
            id="memoryList"
            class="memory-list"
        >

            <div class="memory-empty">
                Loading memory...
            </div>

        </div>

    </div>

</div>


<!-- =================================================
     MENU JAVASCRIPT
     ================================================= -->

<script>

(() => {

    "use strict";


    const menu =
        document.getElementById("atharvMenu");

    const overlay =
        document.getElementById("menuOverlay");

    const menuButton =
        document.getElementById("menuButton");

    const menuClose =
        document.getElementById("menuClose");


    function openMenu() {

        if (!menu) return;

        menu.classList.add("open");

        overlay?.classList.add("open");

        menu.setAttribute(
            "aria-hidden",
            "false"
        );

        menuButton?.setAttribute(
            "aria-expanded",
            "true"
        );

        document.body.classList.add(
            "menu-open"
        );

    }


    function closeMenu() {

        if (!menu) return;

        menu.classList.remove("open");

        overlay?.classList.remove("open");

        menu.setAttribute(
            "aria-hidden",
            "true"
        );

        menuButton?.setAttribute(
            "aria-expanded",
            "false"
        );

        document.body.classList.remove(
            "menu-open"
        );

    }


    menuButton?.addEventListener(
        "click",
        openMenu
    );


    menuClose?.addEventListener(
        "click",
        closeMenu
    );


    overlay?.addEventListener(
        "click",
        closeMenu
    );


    document.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Escape"
            ) {

                closeMenu();

            }

        }
    );


    /*
    ==================================================
    MENU ATTACHMENT
    ==================================================
    */

    document
        .getElementById("menuAttachmentButton")
        ?.addEventListener(
            "click",
            () => {

                closeMenu();

                const button =
                    document.getElementById(
                        "attachmentButton"
                    );

                if (button) {
                    button.click();
                }

            }
        );


    /*
    ==================================================
    MENU VOICE
    ==================================================
    */

    document
        .getElementById("menuVoiceButton")
        ?.addEventListener(
            "click",
            () => {

                closeMenu();

                const button =
                    document.getElementById(
                        "voiceButton"
                    );

                if (button) {
                    button.click();
                }

            }
        );


    /*
    ==================================================
    MENU LIVE SEARCH
    app.js itself handles the actual toggle.
    We ONLY close the menu here.
    ==================================================
    */

    document
        .getElementById("liveButton")
        ?.addEventListener(
            "click",
            () => {

                closeMenu();

            }
        );


    /*
    ==================================================
    MOBILE KEYBOARD
    Does not modify the composer.
    ==================================================
    */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            () => {

                requestAnimationFrame(() => {

                    const container =
                        document.getElementById(
                            "chatContainer"
                        );

                    if (!container) return;

                    if (
                        document.activeElement ===
                        document.getElementById(
                            "messageInput"
                        )
                    ) {

                        container.scrollTop =
                            container.scrollHeight;

                    }

                });

            }
        );

    }


    /*
    ==================================================
    KEEP INPUT VISIBLE WHEN KEYBOARD OPENS
    ==================================================
    */

    const input =
        document.getElementById(
            "messageInput"
        );

    input?.addEventListener(
        "focus",
        () => {

            setTimeout(() => {

                input.scrollIntoView({
                    block: "nearest",
                    behavior: "smooth"
                });

            }, 250);

        }
    );


})();

</script>


<!-- =================================================
     ATHARV AI APP
     IMPORTANT:
     app.js AFTER ALL DOM ELEMENTS
     ================================================= -->

<script
    type="module"
    src="./app.js"
></script>


</body>
</html>
